# Builds the desktop app and the server jar for a version tag and attaches them to a draft release.
# Push a tag such as v0.2.0 (or run it by hand with a tag name); review the draft, then publish it.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Same checks as CI, so nothing untested is released.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Server tests
        working-directory: src/server
        run: ./mvnw -B verify
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml
      - name: App tests
        working-directory: src/app
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  server:
    name: Server jar
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        working-directory: src/server
        run: ./mvnw -B -q -DskipTests package
      - name: Name it after the version
        run: cp src/server/target/hyflip-server.jar "hyflip-server-${TAG#v}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: hyflip-server-*.jar
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The release build packages the server jar (pnpm server:package) into the bundle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/src-tauri
      - name: Install app dependencies
        working-directory: src/app
        run: pnpm install --frozen-lockfile
      - name: Version from the tag
        shell: bash
        run: |
          version="${TAG#v}"
          # MSI needs a numeric version: drop any -suffix (v1.2.0-beta.1 → 1.2.0).
          echo "VERSION=${version%%-*}" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "VITE_REPO_URL=${{ github.server_url }}/${{ github.repository }}" >> "$GITHUB_ENV"
      - name: Build
        working-directory: src/app
        shell: bash
        run: pnpm tauri:build --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\"}"
      # Unit tests cannot catch start-up failures that only show in a release build on Windows
      # (the jar path once came as \\?\C:\..., which java -jar cannot open). Start the real app,
      # wait for its server to listen, kill the app and check the server follows within 15 s.
      - name: Smoke test the release app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -PassThru "src/app/src-tauri/target/release/hyflip.exe"
          $log = Join-Path $env:APPDATA "com.hyflip.app\logs\server.log"
          $java = $null
          $port = $null
          for ($i = 0; $i -lt 90 -and -not $port; $i++) {
            Start-Sleep 1
            $java = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" | Where-Object Name -eq "java.exe" | Select-Object -First 1
            if ($java) {
              $port = Get-NetTCPConnection -State Listen -OwningProcess $java.ProcessId -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $port) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "The server did not start listening within 90 s"
          }
          Write-Host "Server (java.exe $($java.ProcessId)) listens on port $($port.LocalPort)"
          Start-Sleep 3
          Stop-Process -Id $app.Id -Force
          $watch = [Diagnostics.Stopwatch]::StartNew()
          while ((Get-Process -Id $java.ProcessId -ErrorAction SilentlyContinue) -and $watch.Elapsed.TotalSeconds -lt 30) {
            Start-Sleep -Milliseconds 500
          }
          $gone = -not (Get-Process -Id $java.ProcessId -ErrorAction SilentlyContinue)
          Write-Host ("Server gone: {0} after {1:N1} s" -f $gone, $watch.Elapsed.TotalSeconds)
          if (-not $gone -or $watch.Elapsed.TotalSeconds -gt 15) {
            Get-Content $log -Tail 60
            Stop-Process -Id $java.ProcessId -Force -ErrorAction SilentlyContinue
            throw "The server did not stop within 15 s after the app was killed"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            src/app/src-tauri/target/release/bundle/deb/*.deb
            src/app/src-tauri/target/release/bundle/appimage/*.AppImage
            src/app/src-tauri/target/release/bundle/msi/*.msi
            src/app/src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Draft release
    needs: [server, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Artifacts keep their bundle folders (appimage/, deb/, msi/, nsis/): flatten them so every file is
      # checksummed and attached at the top level.
      - name: Checksums
        working-directory: assets
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: HyFlip ${{ env.TAG }}
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: assets/*
          body: |
            **Needs Java 17 or newer** (the Minecraft launcher's runtime works too; set `HYFLIP_JAVA` to its `java` if it is not on `PATH`).

            - Windows: `.msi` or the `-setup.exe` installer
            - Linux: `.deb` or the `.AppImage`
            - Server only (headless, any OS): `hyflip-server-*.jar`, run with `java -jar`

            Check downloads against `SHA256SUMS.txt`.
